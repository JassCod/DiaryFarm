<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DairyFarm — herd management for cows and buffaloes: milk yield, health, breeding and calving records." />
    <title>DairyFarm Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: linear-gradient(135deg, #d9f5ec, #e3efff); }
      #boot-loader { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 1rem; font-family: Poppins, system-ui, sans-serif; color: #3f5a5e; }
      .boot-bottle { width: 50px; height: 80px; border: 4px solid #0f766e; border-radius: 12px 12px 16px 16px; position: relative; overflow: hidden; }
      .boot-milk { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; animation: bootfill 1.4s ease-in-out infinite; }
      @keyframes bootfill { 0% { height: 0; } 60%, 100% { height: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot-loader">
      <div class="boot-bottle"><div class="boot-milk"></div></div>
      <p>Loading your farm…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
